<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CS Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{--pri:#4F46E5;--pri-d:#4338CA;--pri-l:#E0E7FF;--acc:#F59E0B;--acc-l:#FEF3C7;--ok:#10B981;--ok-l:#D1FAE5;--ng:#EF4444;--ng-l:#FEE2E2;--bg:#F3F4F6;--sf:#FFF;--sf2:#F9FAFB;--bd:#E5E7EB;--tx:#111827;--tx2:#6B778C;--tx3:#9CA3AF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6;min-height:100vh}
a{color:var(--pri);text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer}

.loading{text-align:center;padding:40px;color:var(--tx2);font-size:14px}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667EEA,#764BA2);padding:24px}
.login-card{background:#fff;padding:48px 40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.12);width:100%;max-width:420px;text-align:center}
.login-card h1{font-size:28px;font-weight:900;margin:12px 0 4px}
.login-card .sub{color:var(--tx2);font-size:14px;margin-bottom:28px}
.login-card label{display:block;text-align:left;font-weight:600;font-size:13px;color:var(--tx2);margin-bottom:6px}
.login-card input{width:100%;padding:12px 16px;font-size:15px;border:2px solid var(--bd);border-radius:8px;outline:none;font-family:inherit}
.login-card input:focus{border-color:var(--pri)}
.login-card button{width:100%;margin-top:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--pri);border:none;border-radius:8px}
.login-card button:hover{background:var(--pri-d)}
.login-card .hint{margin-top:16px;font-size:12px;color:var(--tx3)}

.nav{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 32px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-brand{font-weight:800;font-size:16px;color:var(--pri)}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-links a{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:500;color:var(--tx2)}
.nav-links a:hover,.nav-links a.active{background:var(--pri-l);color:var(--pri);font-weight:700}
.nav-logout{color:var(--tx3)!important}
.nav-badge{background:var(--ng);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;margin-left:4px}

.page{max-width:100%;margin:0 auto;padding:24px 24px 80px}

.uc{background:linear-gradient(135deg,#667EEA,#764BA2);border-radius:16px;padding:24px;color:#fff;display:flex;gap:20px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.uc-left{display:flex;align-items:center;gap:16px;flex:1;min-width:200px}
.uc-avatar{width:60px;height:60px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.uc-lvl{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--acc);padding:1px 8px;border-radius:10px;font-size:10px;font-weight:800;white-space:nowrap}
.uc-name{font-size:20px;font-weight:800}
.uc-title{font-size:12px;opacity:.85}
.xp-bar{width:100%;height:8px;background:rgba(0,0,0,.2);border-radius:4px;overflow:hidden;margin-top:8px}
.xp-fill{height:100%;background:linear-gradient(90deg,#FBBF24,#F59E0B);border-radius:4px;transition:width .5s}
.xp-txt{font-size:11px;opacity:.8;margin-top:4px}
.uc-stats{display:flex;gap:12px}
.uc-stat{text-align:center;padding:8px 14px;background:rgba(255,255,255,.15);border-radius:8px;min-width:64px}
.uc-stat-n{font-size:18px;font-weight:800}
.uc-stat-l{font-size:10px;opacity:.8}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.bdg{background:var(--sf);border:1px solid var(--bd);padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600}

.wb{background:var(--acc-l);border:1px solid #FDE68A;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px;font-weight:600;color:#92400E}
.wb a{color:#D97706;font-weight:700}
.wb-r{background:var(--ng-l);border-color:#FECACA;color:#991B1B}
.wb-r a{color:var(--ng)}

.world{background:var(--sf);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.world-hdr{display:flex;align-items:center;gap:14px;padding-bottom:16px;margin-bottom:16px;border-bottom:2px solid var(--bd)}
.world-icon{font-size:36px;background:var(--pri-l);width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.world-t{font-size:18px;font-weight:800}
.world-s{font-size:12px;color:var(--tx2);margin-top:2px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stg{background:var(--sf2);border:2px solid var(--bd);border-radius:10px;padding:16px;position:relative;transition:all .2s}
.stg:hover:not(.locked){border-color:var(--pri);transform:translateY(-2px)}
.stg.locked{opacity:.55}
.stg.cleared{border-color:var(--ok);background:var(--ok-l)}
.stg-icon{font-size:32px;margin-bottom:6px}
.stg-t{font-size:15px;font-weight:800;margin-bottom:2px}
.stg-s{font-size:11px;color:var(--tx2);margin-bottom:10px}
.stg-meta{background:var(--sf);padding:8px 10px;border-radius:6px;margin-bottom:10px;font-size:11px}
.stg-meta div{display:flex;justify-content:space-between;padding:1px 0}
.stg-meta span{color:var(--tx2)}
.stg-meta strong{color:var(--tx)}
.stg-btn{display:block;text-align:center;padding:9px;background:var(--pri);color:#fff;border-radius:6px;font-weight:700;font-size:13px;border:none;width:100%}
.stg-btn:hover{background:var(--pri-d);color:#fff}
.stg-btn:disabled{background:var(--bd);color:var(--tx3);cursor:not-allowed}
.cleared-mk{position:absolute;top:10px;right:10px;background:var(--ok);color:#fff;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700}

.quiz-hdr{background:var(--sf);border-radius:14px;padding:24px;margin-bottom:20px}
.quiz-hdr h2{font-size:20px;font-weight:800;margin-bottom:4px}
.quiz-hdr .desc{color:var(--tx2);font-size:12px;margin-bottom:12px}
.quiz-meta{display:flex;gap:10px;font-size:11px;color:var(--tx2);flex-wrap:wrap}
.quiz-meta span{padding:3px 8px;background:var(--sf2);border-radius:10px}
.qc{background:var(--sf);border-radius:10px;padding:20px;margin-bottom:12px;border-left:4px solid var(--pri)}
.qn{font-size:11px;font-weight:700;color:var(--pri);margin-bottom:6px}
.qt{font-size:14px;font-weight:500;line-height:1.7;margin-bottom:14px;white-space:pre-wrap}
.ans-g{display:flex;flex-direction:column;gap:6px}
.ans-g.ox{flex-direction:row;gap:10px}
.ans-o{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border:2px solid var(--bd);border-radius:8px;cursor:pointer;background:var(--sf2);transition:all .12s;font-size:14px}
.ans-o:hover{border-color:var(--pri);background:var(--pri-l)}
.ans-o.selected{border-color:var(--pri);background:var(--pri-l);font-weight:700;color:var(--pri)}
.ans-g.ox .ans-o{flex:1;justify-content:center;padding:16px;font-size:24px;font-weight:900}
.ans-o.ox-yes.selected{color:var(--ok)}
.ans-o.ox-no.selected{color:var(--ng)}
.blank-in{width:100%;padding:10px 14px;font-size:14px;border:2px solid var(--bd);border-radius:8px;outline:none;font-family:inherit}
.blank-in:focus{border-color:var(--pri)}
.submit-bar{position:sticky;bottom:12px;background:var(--sf);border:2px solid var(--pri);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:20px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.prog{font-size:12px;font-weight:600;color:var(--tx2)}
.prog b{color:var(--pri)}
.submit-btn{padding:10px 24px;background:var(--tx3);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:14px;transition:all .15s}
.submit-btn.ready{background:var(--pri)}
.submit-btn.ready:hover{background:var(--pri-d)}

.res-hero{border-radius:16px;padding:40px 32px;text-align:center;margin-bottom:20px;color:#fff}
.res-hero.passed{background:linear-gradient(135deg,#10B981,#059669)}
.res-hero.failed{background:linear-gradient(135deg,#F59E0B,#D97706)}
.res-hero h1{font-size:24px;font-weight:900;margin:12px 0 20px}
.res-summary{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.rs-c{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:14px 20px;border-radius:10px;min-width:90px;text-align:center}
.rs-c .l{font-size:11px;opacity:.85;font-weight:600}
.rs-c .v{font-size:28px;font-weight:900;line-height:1.1;margin-top:4px}
.rs-c.sc{background:rgba(255,255,255,.95);color:var(--tx)}
.rs-c.sc .l{color:var(--tx2)}
.res-sub{font-size:13px;opacity:.9;margin-bottom:16px}
.gain{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.gain-c{background:rgba(255,255,255,.2);padding:8px 16px;border-radius:20px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.3);font-size:13px}
.gain-c.lvl{background:rgba(255,255,255,.95);color:var(--acc);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.03)}}
.nb-area{margin-top:20px}
.nb-title{font-size:13px;font-weight:700;margin-bottom:10px;opacity:.9}
.nb-list{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nb-card{background:rgba(255,255,255,.95);color:var(--tx);padding:14px 18px;border-radius:10px;min-width:120px;text-align:center}
.nb-card .i{font-size:28px}
.nb-card .n{font-weight:800;font-size:13px;margin-top:4px}
.nb-card .d{font-size:10px;color:var(--tx2);margin-top:2px}

.sec-t{font-size:16px;font-weight:800;margin:20px 0 12px}
.sec-t.ok-t{color:var(--ok)}

.rv{background:var(--sf);border-radius:10px;padding:16px 20px;margin-bottom:10px;border-left:4px solid var(--bd)}
.rv.wrong{border-left-color:var(--ng)}
.rv.correct{border-left-color:var(--ok)}
.rv.correct.collapsed .rv-body{display:none}
.rv.correct.collapsed{cursor:pointer;padding:12px 20px}
.rv.correct.collapsed:hover{background:var(--sf2)}
.rv.correct.collapsed .rv-h{margin-bottom:0}
.rv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rv-num{font-size:12px;font-weight:600;color:var(--tx2)}
.rv-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.rv-tag.wrong{background:var(--ng-l);color:var(--ng)}
.rv-tag.correct{background:var(--ok-l);color:var(--ok)}
.rv-q{font-size:13px;font-weight:500;margin-bottom:10px;line-height:1.7;white-space:pre-wrap}
.rv-body{}
.rv-ar{font-size:12px;margin-bottom:4px;display:flex;gap:8px}
.rv-ar .lbl{color:var(--tx2);font-weight:600;min-width:50px}
.rv-ar .val{color:var(--tx)}
.rv-ar .val.wt{color:var(--ng);font-weight:700;text-decoration:line-through}
.rv-ar .val.ct{color:var(--ok);font-weight:700}
.rv-choices{margin-top:8px}
.rv-ch{padding:6px 10px;margin-bottom:3px;font-size:12px;background:var(--sf2);border-radius:6px;border:1px solid var(--bd)}
.rv-ch.cc{background:var(--ok-l);border-color:var(--ok);color:#065F46;font-weight:700}
.rv-ch.wc{background:var(--ng-l);border-color:var(--ng);color:var(--ng);text-decoration:line-through}
.rv-exp{margin-top:10px;padding:10px 12px;background:var(--acc-l);border-left:3px solid var(--acc);border-radius:6px}
.rv-exp .el{font-size:11px;font-weight:700;color:#D97706;margin-bottom:3px}
.rv-exp .et{font-size:12px;line-height:1.7}
.rv-exp .er{font-size:10px;color:var(--tx2);font-style:italic;margin-top:4px}

.actions{display:flex;gap:10px;margin-top:24px;justify-content:center;flex-wrap:wrap}
.btn-p,.btn-s{padding:10px 24px;border-radius:8px;font-weight:700;font-size:14px;border:none}
.btn-p{background:var(--pri);color:#fff}
.btn-p:hover{background:var(--pri-d)}
.btn-s{background:var(--sf);color:var(--pri);border:2px solid var(--pri)}
.btn-s:hover{background:var(--pri-l)}

.wn-bar{font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:14px;padding:8px 14px;background:var(--sf);border-radius:6px;border:1px solid var(--bd)}
.wn{background:var(--sf);border-radius:10px;margin-bottom:8px;border:1px solid var(--bd);border-left:4px solid var(--ng);overflow:hidden}
.wn-h{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px}
.wn-h:hover{background:var(--sf2)}
.wn-stg{font-size:9px;font-weight:700;color:var(--tx3);background:var(--sf2);padding:2px 6px;border-radius:3px;text-transform:uppercase;flex-shrink:0}
.wn-prev{font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wn-arr{font-size:10px;color:var(--tx3);transition:transform .2s}
.wn.open .wn-arr{transform:rotate(180deg)}
.wn-body{display:none;padding:0 16px 16px;border-top:1px solid var(--bd)}
.wn.open .wn-body{display:block;padding-top:12px}
.wn-q{font-size:13px;line-height:1.7;margin-bottom:10px;white-space:pre-wrap}
.wn-ans{font-size:13px;font-weight:700;color:var(--ok);margin-bottom:10px;padding:6px 10px;background:var(--ok-l);border-radius:6px}
.wn-actions{display:flex;gap:8px;margin-top:8px}
.wn-dismiss{padding:5px 12px;font-size:11px;font-weight:600;background:var(--ok-l);color:var(--ok);border:1px solid var(--ok);border-radius:6px;cursor:pointer}
.wn-dismiss:hover{background:var(--ok);color:#fff}
.wn-clear-all{padding:8px 16px;font-size:12px;font-weight:700;background:var(--ng-l);color:var(--ng);border:1px solid var(--ng);border-radius:8px;cursor:pointer;margin-bottom:16px}
.wn-clear-all:hover{background:var(--ng);color:#fff}

.empty{text-align:center;padding:60px 20px}
.empty .ei{font-size:56px;margin-bottom:12px}
.empty .et{font-size:15px;font-weight:600;color:var(--tx2);margin-bottom:20px}

.dash-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.dc{background:var(--sf);border-radius:10px;padding:16px 20px}
.dc-l{font-size:11px;color:var(--tx2);font-weight:600}
.dc-v{font-size:28px;font-weight:900;color:var(--pri);line-height:1.1;margin:4px 0}
.dc-s{font-size:11px;color:var(--tx2)}
.dash-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.dash-tbl th,.dash-tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}
.dash-tbl th{background:var(--sf2);font-weight:700;font-size:10px;text-transform:uppercase;color:var(--tx2)}

.guide-section{background:var(--sf);border-radius:10px;padding:20px;margin-bottom:16px}
.guide-heading{font-size:15px;font-weight:800;color:var(--pri);margin:16px 0 6px;padding-top:8px;border-top:1px solid var(--bd)}
.guide-heading:first-child{border-top:none;padding-top:0}
.guide-text{font-size:13px;margin:4px 0;line-height:1.7}
.guide-path{font-size:12px;color:var(--pri);background:var(--pri-l);padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}
.guide-warn{font-size:12px;color:#B45309;background:var(--acc-l);padding:6px 10px;border-radius:6px;margin:6px 0;border-left:3px solid var(--acc)}
.guide-link{font-size:11px;color:var(--tx3);font-style:italic;margin:4px 0}
.guide-item{font-size:13px;margin:3px 0;padding-left:12px;border-left:2px solid var(--bd);line-height:1.6}
.guide-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.guide-tab{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--bd);background:var(--sf);color:var(--tx2)}
.guide-tab.active{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.guide-search{width:100%;padding:10px 14px;border:2px solid var(--bd);border-radius:8px;font-size:13px;margin-bottom:16px;outline:none;font-family:inherit}
.guide-search:focus{border-color:var(--pri)}

@media(max-width:640px){.uc{flex-direction:column;text-align:center}.uc-stats{justify-content:center}.stages{grid-template-columns:1fr}.res-summary{flex-direction:column;align-items:center}.nav-links{gap:2px}.nav-links a{padding:4px 8px;font-size:11px}}

.admin-section{background:var(--sf);border-radius:10px;padding:20px;margin-bottom:16px}
.admin-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.admin-table th,.admin-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}
.admin-table th{background:var(--sf2);font-weight:700;font-size:10px;text-transform:uppercase;color:var(--tx2);position:sticky;top:0}
.admin-table tr:hover td{background:var(--pri-l)}
.admin-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.admin-tab{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid var(--bd);background:var(--sf);color:var(--tx2)}
.admin-tab.active{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.stat-bar{height:16px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:60px;display:inline-block}
.stat-fill{height:100%;border-radius:4px;display:block}
.stat-fill.good{background:var(--ok)}
.stat-fill.mid{background:var(--acc)}
.stat-fill.bad{background:var(--ng)}
.google-btn{width:100%;padding:14px;font-size:15px;font-weight:700;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;transition:all .15s}
.google-btn:hover{border-color:var(--pri);background:var(--pri-l)}
.kpi-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--sf);border-radius:10px;padding:14px 16px;border:1px solid var(--bd)}
.kpi-l{font-size:11px;font-weight:700;color:var(--tx2)}
.kpi-v{font-size:26px;font-weight:900;color:var(--tx);margin-top:2px}
.kpi-v span{font-size:13px;font-weight:700;color:var(--tx3);margin-left:2px}
.kpi-s{font-size:11px;color:var(--tx3)}
.ul-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ul-search{flex:0 1 240px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.ul-search:focus{border-color:var(--pri)}
.ul-chips{display:flex;gap:6px;flex-wrap:wrap}
.ul-chip{padding:5px 12px;border-radius:14px;border:1.5px solid var(--bd);background:var(--sf);font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit}
.ul-chip b{margin-left:2px;color:var(--tx3);font-weight:700}
.ul-chip.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.ul-chip.on b{color:var(--pri)}
.admin-table th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.admin-table th.sorted{color:var(--pri)}
.ul-table td{vertical-align:middle}
.ul-row{cursor:pointer}
.ul-user{display:flex;align-items:center;gap:10px}
.ul-av{width:32px;height:32px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.ul-name{font-weight:700;font-size:13px;color:var(--tx)}
.ul-mail,.ul-sub{font-size:11px;color:var(--tx3)}
.ul-num{font-size:12px;font-weight:600;color:var(--tx)}

function userRef(email){return fireDb.collection('users').doc(email)}
async function loadUser(email,name){const d=await userRef(email).get();if(d.exists){const data=d.data();if(name&&name!==data.name){data.name=name;await userRef(email).set(data,{merge:true})}return data}const u={name:name||email,email,total_xp:0,level:1,created_at:new Date().toISOString(),progress:{},badges:[],dismissed_wrong:[]};await userRef(email).set(u);return u}
async function saveUser(email,data){await userRef(email).set(data,{merge:true})}

async function getWrongQuizIds(email){const logs=await fireDb.collection('quiz_logs').where('user_email','==',email).get();const w=new Set(),c=new Set();logs.forEach(d=>{const x=d.data(),k=`${x.world_id}|${x.stage_id}|${x.quiz_id}`;if(x.is_correct)c.add(k);else w.add(k)});const dismissed=state.userData?.dismissed_wrong||[];return[...w].filter(k=>!c.has(k)&&!dismissed.includes(k)).map(k=>{const[wid,sid,qid]=k.split('|');return{wid,sid,qid}})}
function getLevelInfo(xp){const t=MANIFEST.level_thresholds;let cur=t[0],nxt=null;for(let i=0;i<t.length;i++){if(xp>=t[i].xp_required){cur=t[i];nxt=t[i+1]||null}}return{level:cur.level,title:cur.title,xp,nextXp:nxt?nxt.xp_required:null,nextTitle:nxt?nxt.title:null,progress:nxt?Math.round((xp-cur.xp_required)/(nxt.xp_required-cur.xp_required)*100):100}}
function shuffleArray(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function sampleQuiz(wid,sid){const sc=MANIFEST.worlds.find(w=>w.id===wid).stages.find(s=>s.id===sid);const pool=JSON.parse(JSON.stringify(QUIZZES[wid][sid].questions));const sz=sc.sample_size||pool.length;let qs=shuffleArray(pool).slice(0,sz);if(sc.shuffle_choices)qs.forEach(q=>{if(q.type==='multiple_choice'&&q.choices){const ct=q.choices[q.answer];q.choices=shuffleArray(q.choices);q.answer=q.choices.indexOf(ct)}});return qs}
function checkAnswer(q,a){if(q.type==='ox')return q.answer?(a==='true'):(a==='false');if(q.type==='multiple_choice')return parseInt(a)===q.answer;if(q.type==='fill_blank'){const n=(a||'').replace(/\s/g,'').toLowerCase();return[q.answer,...(q.acceptable_answers||[])].some(x=>x.replace(/\s/g,'').toLowerCase()===n)}return false}
function isUnlocked(u,wid,sid){const s=MANIFEST.worlds.find(w=>w.id===wid)?.stages.find(s=>s.id===sid);if(!s?.unlock_condition)return true;const uc=s.unlock_condition;if(uc.type==='stage_clear'){const k=`${wid}_${uc.stage_id}`;return u.progress?.[k]?.status==='cleared'}return true}

const $=document.getElementById('app');

function rLogin(){const err=state.loginError||'';$.innerHTML=`<div class="login-wrap"><div class="login-card"><div style="font-size:56px">🎓</div><h1>CS Academy</h1><p class="sub">Cafe24 CS 상담사 온보딩 트레이닝</p><div style="margin:24px 0 12px;color:var(--tx3);font-size:12px">회사 Google 계정으로 로그인</div><button class="google-btn" onclick="doGoogleLogin()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" style="width:20px;height:20px">Google 계정으로 로그인</button><div class="login-divider"><span>회사 메일이 아직 없다면</span></div><label for="temp-id">임시 계정 ID</label><input id="temp-id" type="text" autocomplete="username" placeholder="관리자에게 받은 ID" onkeydown="if(event.key==='Enter')document.getElementById('temp-pw').focus()"><label for="temp-pw" style="margin-top:10px">비밀번호</label><input id="temp-pw" type="password" autocomplete="current-password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doTempLogin()"><button onclick="doTempLogin()">임시 계정으로 로그인</button><div id="login-error" class="login-error" style="display:${err?'block':'none'}">${err}</div><p class="hint" style="margin-top:16px">@in.cd24.kr 계정 또는 관리자가 발급한 임시 계정만 접속 가능합니다.</p></div></div>`}

function showLoginError(msg){state.loginError=msg;const el=document.getElementById('login-error');if(el){el.textContent=msg;el.style.display=msg?'block':'none'}}
async function doGoogleLogin(){showLoginError('');try{await fireAuth.signInWithPopup(googleProvider)}catch(e){console.error(e);if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')showLoginError('로그인에 실패했습니다. 다시 시도해주세요.')}}
async function doTempLogin(){showLoginError('');const id=(document.getElementById('temp-id')?.value||'').trim().toLowerCase();const pw=document.getElementById('temp-pw')?.value||'';if(!id||!pw){showLoginError('ID와 비밀번호를 입력해주세요.');return}try{$.querySelector('.login-card button:last-of-type')?.setAttribute('disabled','disabled');await fireAuth.signInWithEmailAndPassword(id+TEMP_EMAIL_DOMAIN,pw)}catch(e){console.error(e);const bad=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email','auth/invalid-login-credentials'];showLoginError(bad.includes(e.code)?'ID 또는 비밀번호가 올바르지 않습니다.':e.code==='auth/too-many-requests'?'로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.':'로그인에 실패했습니다. 다시 시도해주세요.');$.querySelector('.login-card button:last-of-type')?.removeAttribute('disabled')}}

async function rMap(){const u=state.userData,l=getLevelInfo(u.total_xp),w=await getWrongQuizIds(state.userEmail),wc=w.length;const logs=await fireDb.collection('quiz_logs').where('user_email','==',state.userEmail).get();let tt=0,cc=0;logs.forEach(d=>{tt++;if(d.data().is_correct)cc++});const ac=tt?Math.round(cc/tt*100):0;const bg=(u.badges||[]);
let h=nav(wc)+`<div class="page"><div class="uc"><div class="uc-left"><div class="uc-avatar">👤<div class="uc-lvl">Lv.${l.level}</div></div><div><div class="uc-name">${u.name}</div><div class="uc-title">${l.title}</div><div class="xp-bar"><div class="xp-fill" style="width:${l.progress}%"></div></div><div class="xp-txt">${l.xp}${l.nextXp?' / '+l.nextXp+' XP → '+l.nextTitle:' XP (MAX)'}</div></div></div><div class="uc-stats"><div class="uc-stat"><div class="uc-stat-n">${tt}</div><div class="uc-stat-l">푼 문제</div></div><div class="uc-stat"><div class="uc-stat-n">${ac}%</div><div class="uc-stat-l">정답률</div></div><div class="uc-stat"><div class="uc-stat-n">${bg.length}</div><div class="uc-stat-l">배지</div></div></div></div>`;
if(bg.length)h+=`<div class="badges">${bg.map(id=>{const b=MANIFEST.badges.find(x=>x.id===id);return b?`<div class="bdg">${b.icon} ${b.name}</div>`:''}).join('')}</div>`;
if(wc>0)h+=`<div class="wb"><span>📝 오답노트에 ${wc}문제가 있어요!</span><a onclick="goWrong()">복습하러 가기 →</a></div>`;
for(const world of MANIFEST.worlds){h+=`<div class="world"><div class="world-hdr"><div class="world-icon">${world.icon}</div><div><div class="world-t">${world.title}</div><div class="world-s">${world.subtitle}</div></div></div><div class="stages">`;for(const s of world.stages){const ul=isUnlocked(u,world.id,s.id),pk=`${world.id}_${s.id}`,p=(u.progress||{})[pk]||{},cl=p.status==='cleared',ps=QUIZZES[world.id][s.id].questions.length,cls=!ul?'locked':(cl?'cleared':'');h+=`<div class="stg ${cls}"><div class="stg-icon">${ul?s.icon:'🔒'}</div><div class="stg-t">${s.title}</div><div class="stg-s">${s.subtitle}</div>`;if(!ul)h+=`<div style="font-size:11px;color:var(--tx3);margin-bottom:8px;font-style:italic">이전 스테이지 클리어 필요</div><button class="stg-btn" disabled>잠김</button>`;else{h+=`<div class="stg-meta"><div><span>최고점수</span><strong>${p.best_score||0}점</strong></div><div><span>도전</span><strong>${p.attempts||0}회</strong></div><div><span>통과기준</span><strong>${s.pass_score}점</strong></div><div><span>문항풀</span><strong>${ps}개 중 ${s.sample_size}개</strong></div></div><button class="stg-btn" onclick="startQuiz('${world.id}','${s.id}')">${cl?'재도전':(p.attempts>0?'이어하기':'시작하기')}</button>`;if(cl)h+=`<div class="cleared-mk">✓ 클리어</div>`}h+=`</div>`}h+=`</div></div>`}h+=`</div>`;$.innerHTML=h}

function startQuiz(w,s){state.currentQuiz={wid:w,sid:s,questions:sampleQuiz(w,s),answers:{}};state.page='quiz';render()}
function rQuiz(){const{wid,sid,questions,answers}=state.currentQuiz;const world=MANIFEST.worlds.find(w=>w.id===wid),stage=world.stages.find(s=>s.id===sid),ps=QUIZZES[wid][sid].questions.length,ac=Object.keys(answers).filter(k=>answers[k]!==undefined&&answers[k]!=='').length;let h=`<nav class="nav"><div class="nav-brand">🎓 CS Academy${state.isTemp?`<span class="temp-badge">임시 계정 · ${fmtDate(state.tempExpires)}까지</span>`:''}</div><div class="nav-links"><a onclick="goMap()">← 맵으로</a></div></nav><div class="page"><div class="quiz-hdr"><div style="font-size:11px;color:var(--tx2)">${world.title} › ${stage.title}</div><h2>${stage.title} ${stage.icon}</h2><div class="desc">${questions.length}문항 (풀 ${ps}개 중 랜덤 출제)</div><div class="quiz-meta"><span>⭐ ${stage.xp_per_question} XP/문항</span><span>🎯 통과 ${stage.pass_score}점</span></div></div>`;questions.forEach((q,i)=>{h+=`<div class="qc"><div class="qn">문제 ${i+1} / ${questions.length}</div><div class="qt">${q.question.replace(/\n/g,'<br>')}</div>`;if(q.type==='ox')h+=`<div class="ans-g ox"><div class="ans-o ox-yes ${answers[q.id]==='true'?'selected':''}" onclick="selAns('${q.id}','true')">O</div><div class="ans-o ox-no ${answers[q.id]==='false'?'selected':''}" onclick="selAns('${q.id}','false')">X</div></div>`;else if(q.type==='multiple_choice')h+=`<div class="ans-g">${q.choices.map((c,ci)=>`<div class="ans-o ${answers[q.id]===''+ci?'selected':''}" onclick="selAns('${q.id}','${ci}')">${c}</div>`).join('')}</div>`;else h+=`<div class="ans-g"><input class="blank-in" placeholder="답을 입력하세요" value="${answers[q.id]||''}" oninput="selAns('${q.id}',this.value)"></div>`;h+=`</div>`});h+=`<div class="submit-bar"><div class="prog"><b>${ac}</b> / ${questions.length} 답변 완료</div><button class="submit-btn ${ac===questions.length?'ready':''}" onclick="submitQuiz()">제출하고 결과 보기</button></div></div>`;$.innerHTML=h}
function selAns(qid,val){state.currentQuiz.answers[qid]=val;const ac=Object.keys(state.currentQuiz.answers).filter(k=>{const v=state.currentQuiz.answers[k];return v!==undefined&&v!==''}).length;const t=state.currentQuiz.questions.length;const p=document.querySelector('.prog');if(p)p.innerHTML=`<b>${ac}</b> / ${t} 답변 완료`;const b=document.querySelector('.submit-btn');if(b)b.classList.toggle('ready',ac===t);document.querySelectorAll('.qc').forEach(card=>{card.querySelectorAll('.ans-o').forEach(o=>{const oc=o.getAttribute('onclick');if(oc&&oc.includes(`'${qid}'`))o.classList.toggle('selected',oc.includes(`'${val}'`))})})}

async function submitQuiz(){const{wid,sid,questions,answers}=state.currentQuiz;const stage=MANIFEST.worlds.find(w=>w.id===wid).stages.find(s=>s.id===sid);const u=state.userData;const un=questions.filter(q=>!answers[q.id]&&answers[q.id]!=='0');if(un.length>0&&!confirm(`${un.length}문제가 남아있어요. 제출할까요?`))return;$.innerHTML='<div class="loading">채점 중...</div>';let cc=0;const results=[];for(const q of questions){const ua=answers[q.id]||'';const ok=checkAnswer(q,ua);if(ok)cc++;let uc,crc;if(q.type==='multiple_choice'){uc=ua!==''?(q.choices[parseInt(ua)]||'(미응답)'):'(미응답)';crc=q.choices[q.answer]}else if(q.type==='ox'){uc=ua==='true'?'O':ua==='false'?'X':'(미응답)';crc=q.answer?'O':'X'}else{uc=ua||'(미응답)';crc=q.answer}results.push({...q,userAnswer:ua,userChoice:uc,correctChoice:crc,isCorrect:ok});await logQuiz(state.userEmail,state.userName,wid,sid,q.id,ok,ua,uc)}const tt=questions.length,sc=Math.round(cc/tt*100),wc=tt-cc,passed=sc>=stage.pass_score,xp=cc*stage.xp_per_question;const ol=u.level;u.total_xp+=xp;const lv=getLevelInfo(u.total_xp);u.level=lv.level;if(!u.progress)u.progress={};const pk=`${wid}_${sid}`,pv=u.progress[pk]||{status:'',best_score:0,attempts:0};u.progress[pk]={status:passed?'cleared':(pv.status==='cleared'?'cleared':'in_progress'),best_score:Math.max(pv.best_score||0,sc),attempts:(pv.attempts||0)+1};if(!u.badges)u.badges=[];const nb=[];function tb(id){if(!u.badges.includes(id)){u.badges.push(id);const b=MANIFEST.badges.find(x=>x.id===id);if(b)nb.push(b)}}tb('first_step');if(passed)tb(`${wid}_${sid}`);if(passed&&sc===100){const wd=MANIFEST.worlds.find(w=>w.id===wid);if(wd.stages.every(s=>(u.progress[`${wid}_${s.id}`]||{}).best_score===100))tb(`${wid}_perfect`)}const allW=MANIFEST.worlds.every(wd=>wd.stages.every(s=>(u.progress[`${wd.id}_${s.id}`]||{}).status==='cleared'));if(allW)tb('all_clear');await saveUser(state.userEmail,u);state.userData=u;state.lastResult={wid,sid,results,score:sc,correctCount:cc,wrongCount:wc,total:tt,passed,passScore:stage.pass_score,earnedXp:xp,newLevel:lv.level,newLevelTitle:lv.title,leveledUp:lv.level>ol,newBadges:nb};state.page='result';render()}

function rResult(){const r=state.lastResult;let h=`<nav class="nav"><div class="nav-brand">🎓 CS Academy${state.isTemp?`<span class="temp-badge">임시 계정 · ${fmtDate(state.tempExpires)}까지</span>`:''}</div><div class="nav-links"><a onclick="goMap()">← 맵으로</a></div></nav><div class="page"><div class="res-hero ${r.passed?'passed':'failed'}"><div style="font-size:56px">${r.passed?'🎉':'💪'}</div><h1>${r.passed?'고생하셨습니다! 통과!':'아쉽지만 다시 도전해봐요!'}</h1><div class="res-summary"><div class="rs-c"><div class="l">총 문제</div><div class="v">${r.total}</div></div><div class="rs-c"><div class="l">정답</div><div class="v">${r.correctCount}</div></div><div class="rs-c"><div class="l">오답</div><div class="v">${r.wrongCount}</div></div><div class="rs-c sc"><div class="l">점수</div><div class="v">${r.score}점</div></div></div><div class="res-sub">통과 기준 ${r.passScore}점</div><div class="gain"><div class="gain-c"><span>⭐</span>+${r.earnedXp} XP</div>${r.leveledUp?`<div class="gain-c lvl"><span>🎊</span>레벨업! → ${r.newLevelTitle} (Lv.${r.newLevel})</div>`:''}</div>${r.newBadges.length?`<div class="nb-area"><div class="nb-title">🏆 새 배지 획득</div><div class="nb-list">${r.newBadges.map(b=>`<div class="nb-card"><div class="i">${b.icon}</div><div class="n">${b.name}</div><div class="d">${b.desc}</div></div>`).join('')}</div></div>`:''}</div>`;if(r.wrongCount>0)h+=`<div class="wb wb-r"><span>📝 ${r.wrongCount}문제를 틀렸어요!</span><a onclick="goWrong()">오답노트 바로가기 →</a></div>`;const ws=r.results.filter(x=>!x.isCorrect),cs=r.results.filter(x=>x.isCorrect);if(ws.length){h+=`<h2 class="sec-t">✗ 오답 문항</h2>`;ws.forEach((v,i)=>h+=rvCard(v,i+1,false))}if(cs.length){h+=`<h2 class="sec-t ok-t">✓ 정답 문항 (클릭하여 펼치기)</h2>`;cs.forEach((v,i)=>h+=rvCard(v,i+1,true))}h+=`<div class="actions"><button class="btn-p" onclick="goMap()">맵으로</button><button class="btn-s" onclick="startQuiz('${r.wid}','${r.sid}')">한 번 더 도전 (다른 문제!)</button></div></div>`;$.innerHTML=h}
function rvCard(v,i,ok){let h=`<div class="rv ${ok?'correct collapsed':'wrong'}" ${ok?'onclick="this.classList.toggle(\'collapsed\')"':''}>`;h+=`<div class="rv-h"><div class="rv-num">${ok?v.question.substring(0,40)+(v.question.length>40?'...':''):'문제 '+i}</div><div class="rv-tag ${ok?'correct':'wrong'}">${ok?'✓ 정답':'✗ 오답'}</div></div><div class="rv-body"><div class="rv-q">${v.question.replace(/\n/g,'<br>')}</div>`;if(!ok){h+=`<div class="rv-ar"><span class="lbl">내 답변:</span><span class="val wt">${v.userChoice}</span></div><div class="rv-ar"><span class="lbl">정답:</span><span class="val ct">${v.correctChoice}</span></div>`;if(v.type==='multiple_choice'&&v.choices)h+=`<div class="rv-choices">${v.choices.map((c,ci)=>{let cls='';if(ci===v.answer)cls='cc';else if(''+ci===v.userAnswer&&ci!==v.answer)cls='wc';return`<div class="rv-ch ${cls}">${c}</div>`}).join('')}</div>`}if(v.explanation)h+=`<div class="rv-exp"><div class="el">💡 해설</div><div class="et">${v.explanation}</div>${v.guide_ref?`<div class="er">📖 ${v.guide_ref}</div>`:''}</div>`;h+=`</div></div>`;return h}

async function rWrong(){const wi=await getWrongQuizIds(state.userEmail);let h=nav(wi.length)+`<div class="page"><h1 style="font-size:18px;font-weight:800;margin-bottom:4px">📝 오답노트</h1><p style="color:var(--tx2);font-size:12px;margin-bottom:16px">아직 한 번도 맞추지 못한 문제들이에요.</p>`;if(!wi.length)h+=`<div class="empty"><div class="ei">🎉</div><div class="et">오답이 없어요!</div><button class="btn-p" onclick="goMap()">맵으로</button></div>`;else{h+=`<button class="wn-clear-all" onclick="clearAllWrong()">🗑️ 오답노트 전체 초기화</button><div class="wn-bar">총 ${wi.length}개 문제</div>`;wi.forEach(item=>{const q=QUIZZES[item.wid]?.[item.sid]?.questions.find(x=>x.id===item.qid);if(!q)return;let ans;if(q.type==='multiple_choice')ans=`<div class="rv-choices" style="margin-bottom:10px">${q.choices.map((c,ci)=>`<div class="rv-ch ${ci===q.answer?'cc':''}">${c}${ci===q.answer?' ← 정답':''}</div>`).join('')}</div>`;else if(q.type==='ox')ans=`<div class="wn-ans">정답: ${q.answer?'O':'X'}</div>`;else ans=`<div class="wn-ans">정답: ${q.answer}</div>`;h+=`<div class="wn" onclick="event.target.closest('.wn-dismiss')?null:this.classList.toggle('open')"><div class="wn-h"><div class="wn-stg">${item.wid}/${item.sid}</div><div class="wn-prev">${q.question.substring(0,60)}${q.question.length>60?'...':''}</div><div class="wn-arr">▼</div></div><div class="wn-body"><div class="wn-q">${q.question.replace(/\n/g,'<br>')}</div>${ans}${q.explanation?`<div class="rv-exp"><div class="el">💡 해설</div><div class="et">${q.explanation}</div>${q.guide_ref?`<div class="er">📖 ${q.guide_ref}</div>`:''}</div>`:''}<div class="wn-actions"><button class="wn-dismiss" onclick="dismissWrong('${item.wid}|${item.sid}|${item.qid}')">✓ 이해했어요</button></div></div></div>`});h+=`<div class="actions"><button class="btn-p" onclick="goMap()">맵으로</button></div>`}h+=`</div>`;$.innerHTML=h}

// ===== 사용자별 현황 =====
let _adminRows=[];
function relDay(iso){if(!iso)return{txt:'-',days:Infinity};const d=new Date(iso),t=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(t.getFullYear(),t.getMonth(),t.getDate());const n=Math.round((b-a)/86400000);return{txt:n<=0?'오늘':n===1?'어제':`${n}일 전`,days:n}}
function accCls(a){return a>=80?'good':a>=50?'mid':'bad'}
function adminUsers(users,logs){
const st={};logs.forEach(l=>{const e=(l.user_email||l.user_name||'').toLowerCase();if(!st[e])st[e]={total:0,correct:0,last:''};st[e].total++;if(l.is_correct)st[e].correct++;if((l.answered_at||'')>st[e].last)st[e].last=l.answered_at});
const totalStages=MANIFEST.worlds.reduce((a,w)=>a+w.stages.length,0);
_adminRows=users.map(u=>{const email=(u.email||u.id||'');const k=email.toLowerCase();const x=st[k]||{total:0,correct:0,last:''};const acc=x.total?Math.round(x.correct/x.total*100):0;const cleared=Object.values(u.progress||{}).filter(p=>p.status==='cleared').length;const rd=relDay(x.last);const status=x.total===0?'none':rd.days<=ADMIN_INACTIVE_DAYS?'active':'idle';return{email,name:u.name||'-',xp:u.total_xp||0,lv:getLevelInfo(u.total_xp||0),total:x.total,correct:x.correct,acc,cleared,prog:totalStages?Math.round(cleared/totalStages*100):0,totalStages,last:x.last,rd,status,isTemp:k.endsWith(TEMP_EMAIL_DOMAIN)}});
const n=_adminRows.length,act=_adminRows.filter(r=>r.status==='active').length,none=_adminRows.filter(r=>r.status==='none').length;const tq=logs.length,tc=logs.filter(l=>l.is_correct).length;const tAcc=tq?Math.round(tc/tq*100):0;
let h=`<div class="kpi-g"><div class="kpi"><div class="kpi-l">전체 사용자</div><div class="kpi-v">${n}<span>명</span></div></div><div class="kpi"><div class="kpi-l">최근 ${ADMIN_INACTIVE_DAYS}일 활동</div><div class="kpi-v">${act}<span>명</span></div><div class="kpi-s">${n?Math.round(act/n*100):0}% 참여</div></div><div class="kpi"><div class="kpi-l">전체 정답률</div><div class="kpi-v">${tAcc}<span>%</span></div><div class="kpi-s">${tc.toLocaleString()} / ${tq.toLocaleString()}문항</div></div><div class="kpi"><div class="kpi-l">아직 시작 안 함</div><div class="kpi-v">${none}<span>명</span></div></div></div>`;
const cnt={all:n,active:act,idle:_adminRows.filter(r=>r.status==='idle').length,none,temp:_adminRows.filter(r=>r.isTemp).length};
const chips=[['all','전체'],['active','활동 중'],['idle',`${ADMIN_INACTIVE_DAYS}일+ 미접속`],['none','미시작'],['temp','임시 계정']];
h+=`<div class="admin-section"><div class="ul-bar"><input class="ul-search" placeholder="이름·이메일 검색" value="${esc(state.userSearch)}" oninput="state.userSearch=this.value;renderUserTable()"><div class="ul-chips">${chips.map(([k,t])=>`<button class="ul-chip ${state.userFilter===k?'on':''}" onclick="state.userFilter='${k}';document.querySelectorAll('.ul-chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');renderUserTable()">${t} <b>${cnt[k]}</b></button>`).join('')}</div></div><div id="user-table" style="overflow-x:auto"></div></div>`;
setTimeout(renderUserTable,0);return h}
function sortUsers(key){const s=state.userSort;if(s.key===key)s.dir*=-1;else{s.key=key;s.dir=key==='name'?1:-1}renderUserTable()}
function renderUserTable(){const el=document.getElementById('user-table');if(!el)return;const q=(state.userSearch||'').trim().toLowerCase();const f=state.userFilter;
let rows=_adminRows.filter(r=>(f==='all'||(f==='temp'?r.isTemp:r.status===f))&&(!q||r.name.toLowerCase().includes(q)||r.email.toLowerCase().includes(q)));
const{key,dir}=state.userSort;const val=r=>key==='name'?r.name:key==='last'?(r.last||''):r[key];rows.sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:0)*dir});
const th=(k,t)=>`<th class="sortable ${key===k?'sorted':''}" onclick="sortUsers('${k}')">${t}${key===k?(dir>0?' ▲':' ▼'):''}</th>`;
const stTxt={active:'활동 중',idle:'미접속',none:'미시작'};
let h=`<table class="admin-table ul-table"><thead><tr>${th('name','사용자')}${th('xp','레벨 · XP')}${th('total','풀이')}${th('acc','정답률')}${th('prog','진도')}${th('last','최근 활동')}<th>상태</th></tr></thead><tbody>`;
if(!rows.length)h+=`<tr><td colspan="7" style="text-align:center;color:var(--tx3);padding:24px">조건에 맞는 사용자가 없어요.</td></tr>`;
rows.forEach(r=>{h+=`<tr class="ul-row" data-e="${esc(r.email)}" data-n="${esc(r.name)}" onclick="showUserDetail(this.dataset.e,this.dataset.n)"><td><div class="ul-user"><div class="ul-av">${esc(r.name.charAt(0)||'?')}</div><div><div class="ul-name">${esc(r.name)}${r.isTemp?'<span class="tmp-tag">임시</span>':''}</div><div class="ul-mail">${esc(r.email)}</div></div></div></td><td><span class="lv-chip">Lv.${r.lv.level}</span> <span class="ul-sub">${r.lv.title}</span><div class="ul-num">${r.xp.toLocaleString()} XP</div></td><td class="ul-num">${r.total.toLocaleString()}</td><td>${r.total?`<div class="mini-bar"><div class="stat-bar"><div class="stat-fill ${accCls(r.acc)}" style="width:${r.acc}%"></div></div><span>${r.acc}%</span></div>`:'<span class="ul-sub">-</span>'}</td><td><div class="mini-bar"><div class="stat-bar"><div class="stat-fill prog" style="width:${r.prog}%"></div></div><span>${r.cleared}/${r.totalStages}</span></div></td><td><div class="ul-num">${r.rd.txt}</div>${r.last?`<div class="ul-sub">${fmtDate(r.last)}</div>`:''}</td><td><span class="ul-st ${r.status}">${stTxt[r.status]}</span></td></tr>`});
el.innerHTML=h+`</tbody></table>`}

function adminQuestions(logs){const qStats={};logs.forEach(l=>{const k=`${l.world_id}|${l.stage_id}|${l.quiz_id}`;if(!qStats[k])qStats[k]={total:0,correct:0,wid:l.world_id,sid:l.stage_id,qid:l.quiz_id};qStats[k].total++;if(l.is_correct)qStats[k].correct++});const sorted=Object.values(qStats).sort((a,b)=>(a.total?a.correct/a.total:0)-(b.total?b.correct/b.total:0));let h=`<div class="admin-section"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px">📊 문항별 정답률 (정답률 낮은 순)</h3><div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>월드</th><th>스테이지</th><th>문항ID</th><th>문제 (앞 50자)</th><th>응시</th><th>정답</th><th>정답률</th></tr></thead><tbody>`;sorted.forEach(s=>{const acc=s.total?Math.round(s.correct/s.total*100):0;const accCls=acc>=80?'good':acc>=50?'mid':'bad';const q=QUIZZES[s.wid]?.[s.sid]?.questions.find(x=>x.id===s.qid);const qText=q?q.question.substring(0,50).replace(/\n/g,' '):'(삭제된 문항)';h+=`<tr><td>${s.wid}</td><td>${s.sid}</td><td style="font-size:10px">${s.qid}</td><td style="font-size:11px">${qText}${q&&q.question.length>50?'...':''}</td><td>${s.total}</td><td>${s.correct}</td><td><div style="display:flex;align-items:center;gap:6px"><div class="stat-bar"><div class="stat-fill ${accCls}" style="width:${acc}%"></div></div><span style="font-size:11px;font-weight:700">${acc}%</span></div></td></tr>`});h+=`</tbody></table></div></div>`;return h}

function adminCategory(users,logs){const catStats={};logs.forEach(l=>{const wk=l.world_id;const sk=`${l.world_id}/${l.stage_id}`;[wk,sk].forEach(k=>{if(!catStats[k])catStats[k]={total:0,correct:0};catStats[k].total++;if(l.is_correct)catStats[k].correct++})});let h=`<div class="admin-section"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px">📁 카테고리별 통계</h3><h4 style="font-size:13px;font-weight:700;color:var(--pri);margin:16px 0 8px">월드별 정답률</h4><table class="admin-table"><thead><tr><th>월드</th><th>총 응시</th><th>정답</th><th>정답률</th></tr></thead><tbody>`;MANIFEST.worlds.forEach(w=>{const s=catStats[w.id]||{total:0,correct:0};const acc=s.total?Math.round(s.correct/s.total*100):0;const accCls=acc>=80?'good':acc>=50?'mid':'bad';h+=`<tr><td><strong>${w.icon} ${w.title}</strong></td><td>${s.total}</td><td>${s.correct}</td><td><div style="display:flex;align-items:center;gap:6px"><div class="stat-bar" style="min-width:100px"><div class="stat-fill ${accCls}" style="width:${acc}%"></div></div><span style="font-size:12px;font-weight:700">${acc}%</span></div></td></tr>`});h+=`</tbody></table><h4 style="font-size:13px;font-weight:700;color:var(--pri);margin:16px 0 8px">스테이지별 정답률</h4><table class="admin-table"><thead><tr><th>월드</th><th>스테이지</th><th>총 응시</th><th>정답</th><th>정답률</th></tr></thead><tbody>`;MANIFEST.worlds.forEach(w=>{w.stages.forEach(st=>{const k=`${w.id}/${st.id}`;const s=catStats[k]||{total:0,correct:0};const acc=s.total?Math.round(s.correct/s.total*100):0;const accCls=acc>=80?'good':acc>=50?'mid':'bad';h+=`<tr><td>${w.icon} ${w.title}</td><td>${st.icon} ${st.title}</td><td>${s.total}</td><td>${s.correct}</td><td><div style="display:flex;align-items:center;gap:6px"><div class="stat-bar" style="min-width:100px"><div class="stat-fill ${accCls}" style="width:${acc}%"></div></div><span style="font-size:12px;font-weight:700">${acc}%</span></div></td></tr>`})});h+=`</tbody></table><h4 style="font-size:13px;font-weight:700;color:var(--pri);margin:16px 0 8px">사용자별 클리어 현황</h4><table class="admin-table"><thead><tr><th>이름</th>`;MANIFEST.worlds.forEach(w=>w.stages.forEach(s=>{h+=`<th>${w.icon}${s.icon}</th>`}));h+=`</tr></thead><tbody>`;users.sort((a,b)=>(b.total_xp||0)-(a.total_xp||0));users.forEach(u=>{const email=u.email||u.id||'';h+=`<tr><td><strong><a onclick="showUserDetail('${email}','${u.name||'-'}')" style="cursor:pointer;color:var(--pri)">${u.name||'-'}</a></strong></td>`;MANIFEST.worlds.forEach(w=>w.stages.forEach(s=>{const p=(u.progress||{})[`${w.id}_${s.id}`]||{};h+=`<td style="text-align:center">${p.status==='cleared'?'✅'+p.best_score:p.attempts>0?'🏃'+(p.best_score||0):'➖'}</td>`}));h+=`</tr>`});h+=`</tbody></table></div>`;return h}


// ===== 임시 계정 관리 =====
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let _tempCreatorAuth=null;
async function getTempCreatorAuth(){if(_tempCreatorAuth)return _tempCreatorAuth;const app=firebase.apps.find(a=>a.name===TEMP_CREATOR_APP_NAME)||firebase.initializeApp(FIREBASE_CONFIG,TEMP_CREATOR_APP_NAME);_tempCreatorAuth=app.auth();await _tempCreatorAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);return _tempCreatorAuth}
function genTempPw(){const a=new Uint32Array(TEMP_PW_AUTO_LEN);crypto.getRandomValues(a);return Array.from(a,n=>TEMP_PW_CHARS[n%TEMP_PW_CHARS.length]).join('')}
function tempStatus(t){if(t.migrated_to)return{cls:'mig',txt:'이관 완료',rank:3};if(!t.active)return{cls:'off',txt:'중지',rank:2};if(!t.expires_at||t.expires_at.toDate()<=new Date())return{cls:'exp',txt:'만료',rank:1};const left=Math.ceil((t.expires_at.toDate()-new Date())/86400000);return{cls:'on',txt:`사용 중 · D-${left}`,rank:0}}
function tempCreatedText(c){return`[CS Academy 임시 계정 안내]\n이름: ${c.name}\n접속 주소: ${location.origin+location.pathname}\nID: ${c.id}\n비밀번호: ${c.pw}\n사용 기한: ${c.exp}까지\n\n로그인 화면의 '임시 계정 ID' 칸에 입력해주세요.`}

function adminTemp(temps,users){
const uMap={};users.forEach(u=>uMap[(u.email||u.id||'').toLowerCase()]=u);
const defExp=fmtDate(addDays(new Date(),TEMP_DEFAULT_DAYS)),minExp=fmtDate(addDays(new Date(),1));
let h=`<div class="admin-section"><h3 style="font-size:15px;font-weight:800;margin-bottom:8px">🎫 임시 계정 발급</h3><p class="tmp-desc">회사 메일이 아직 없는 신입 사원용 계정이에요. 만료일 23:59이 지나면 자동으로 접속이 차단돼요. (기본 ${TEMP_DEFAULT_DAYS}일)</p>
<div class="tmp-form"><div><label>이름</label><input id="tmp-name" placeholder="홍길동"></div><div><label>ID</label><input id="tmp-id" placeholder="영문 소문자·숫자 3~30자" autocomplete="off"></div><div><label>초기 비밀번호</label><div class="tmp-pw-row"><input id="tmp-pw" placeholder="${TEMP_MIN_PW}자 이상" autocomplete="new-password"><button class="btn-mini" onclick="document.getElementById('tmp-pw').value=genTempPw()">자동 생성</button></div></div><div><label>만료일</label><input id="tmp-exp" type="date" value="${defExp}" min="${minExp}"></div></div>
<div class="tmp-actions"><button class="btn-s btn-p" onclick="createTempAccount()">임시 계정 생성</button><span id="tmp-msg" class="tmp-msg"></span></div>`;
if(state.tempCreated){h+=`<div class="tmp-created"><div class="tmp-created-t">✅ 생성 완료 — 아래 내용을 신입 사원에게 전달하세요. 비밀번호는 이 화면을 닫으면 다시 볼 수 없어요.</div><pre id="tmp-created-text">${esc(tempCreatedText(state.tempCreated))}</pre><div class="tmp-ops"><button class="btn-mini" onclick="copyTempCreated(this)">복사</button><button class="btn-mini" onclick="state.tempCreated=null;rAdmin()">닫기</button></div></div>`}
h+=`</div>`;
temps.sort((a,b)=>{const ra=tempStatus(a).rank,rb=tempStatus(b).rank;if(ra!==rb)return ra-rb;return(a.expires_at?.toMillis?.()||0)-(b.expires_at?.toMillis?.()||0)});
h+=`<div class="admin-section"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px">📋 임시 계정 목록 (${temps.length}개)</h3>`;
if(!temps.length){h+=`<p style="font-size:12px;color:var(--tx3)">발급된 임시 계정이 없어요.</p></div>`;return h}
h+=`<div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>이름</th><th>ID</th><th>상태</th><th>만료일</th><th>발급</th><th>학습</th><th>관리</th></tr></thead><tbody>`;
temps.forEach(t=>{const st=tempStatus(t);const em=esc(t.id);const u=uMap[t.id]||uMap[t.migrated_to]||null;const learn=u?`Lv.${getLevelInfo(u.total_xp||0).level} · ${u.total_xp||0}XP`:'-';
let ops='-';if(!t.migrated_to){ops=`<div class="tmp-ops"><button class="btn-mini" onclick="extendTemp('${em}')">+${TEMP_DEFAULT_DAYS}일</button>${t.active?`<button class="btn-mini danger" onclick="toggleTemp('${em}',false)">중지</button>`:`<button class="btn-mini" onclick="toggleTemp('${em}',true)">재개</button>`}<button class="btn-mini" onclick="migrateTemp('${em}')">기록 이관</button></div>`}
h+=`<tr><td><strong>${esc(t.name)}</strong></td><td style="font-size:11px">${esc(t.login_id||t.id.replace(TEMP_EMAIL_DOMAIN,''))}</td><td><span class="tmp-st ${st.cls}">${st.txt}</span>${t.migrated_to?`<div style="font-size:10px;color:var(--tx3);margin-top:2px">→ ${esc(t.migrated_to)}</div>`:''}</td><td>${fmtDate(t.expires_at)}</td><td style="font-size:11px;color:var(--tx3)">${fmtDate(t.created_at)}<br>${esc((t.created_by||'').split('@')[0])}</td><td style="font-size:11px">${learn}</td><td>${ops}</td></tr>`});
h+=`</tbody></table></div><p class="tmp-desc" style="margin-top:10px">※ 비밀번호를 잊은 경우 재설정 메일을 받을 수 없어요. 기존 계정은 중지하고 새 ID로 다시 발급해주세요.</p></div>`;return h}

async function copyTempCreated(btn){const t=document.getElementById('tmp-created-text')?.textContent||'';try{await navigator.clipboard.writeText(t);btn.textContent='복사됨'}catch(e){const r=document.createRange();r.selectNode(document.getElementById('tmp-created-text'));getSelection().removeAllRanges();getSelection().addRange(r);btn.textContent='Ctrl+C로 복사'}}

async function createTempAccount(){const msg=t=>{const el=document.getElementById('tmp-msg');if(el)el.textContent=t};
const name=(document.getElementById('tmp-name')?.value||'').trim();const id=(document.getElementById('tmp-id')?.value||'').trim().toLowerCase();const pw=document.getElementById('tmp-pw')?.value||'';const exp=document.getElementById('tmp-exp')?.value||'';
if(!name)return msg('이름을 입력해주세요.');
if(!TEMP_ID_PATTERN.test(id))return msg('ID는 영문 소문자·숫자·( . _ - ) 조합 3~30자로 입력해주세요.');
if(pw.length<TEMP_MIN_PW)return msg(`비밀번호는 ${TEMP_MIN_PW}자 이상이어야 해요.`);
if(!exp)return msg('만료일을 선택해주세요.');
const expDate=endOfDay(exp+'T00:00:00');if(expDate<=new Date())return msg('만료일은 오늘 이후로 선택해주세요.');
const email=id+TEMP_EMAIL_DOMAIN;msg('생성 중...');
try{const ex=await fireDb.collection(TEMP_COLLECTION).doc(email).get();if(ex.exists)return msg('이미 발급된 ID예요. 다른 ID를 입력해주세요.');
const auth2=await getTempCreatorAuth();const cred=await auth2.createUserWithEmailAndPassword(email,pw);try{await cred.user.updateProfile({displayName:name})}catch(e){console.warn(e)}const uid=cred.user.uid;await auth2.signOut();
await fireDb.collection(TEMP_COLLECTION).doc(email).set({email,login_id:id,name,uid,active:true,expires_at:firebase.firestore.Timestamp.fromDate(expDate),created_at:new Date().toISOString(),created_by:state.userEmail,migrated_to:null});
state.tempCreated={id,pw,name,exp:fmtDate(expDate)};await rAdmin()}
catch(e){console.error(e);msg(e.code==='auth/email-already-in-use'?'이미 사용 중인 ID예요. 다른 ID를 입력해주세요.':e.code==='auth/operation-not-allowed'?'Firebase 콘솔에서 이메일/비밀번호 로그인이 사용 설정되지 않았어요.':e.code==='auth/weak-password'?'비밀번호가 너무 약해요.':e.code==='permission-denied'?'권한이 없어요. Firestore 보안 규칙을 확인해주세요.':'생성 실패: '+(e.message||e))}}

async function extendTemp(email){try{const ref=fireDb.collection(TEMP_COLLECTION).doc(email);const d=await ref.get();if(!d.exists)return;const cur=d.data().expires_at?.toDate()||new Date();const base=cur>new Date()?cur:new Date();const next=endOfDay(addDays(base,TEMP_DEFAULT_DAYS));if(!confirm(`${d.data().name} 계정의 만료일을 ${fmtDate(next)}까지 연장할까요?`))return;await ref.update({expires_at:firebase.firestore.Timestamp.fromDate(next),updated_at:new Date().toISOString(),updated_by:state.userEmail});await rAdmin()}catch(e){console.error(e);alert('연장 실패: '+(e.message||e))}}

async function toggleTemp(email,active){if(!active&&!confirm('이 임시 계정을 즉시 중지할까요? 사용자는 바로 접속할 수 없게 돼요.'))return;try{await fireDb.collection(TEMP_COLLECTION).doc(email).update({active,updated_at:new Date().toISOString(),updated_by:state.userEmail});await rAdmin()}catch(e){console.error(e);alert('변경 실패: '+(e.message||e))}}

function mergeUserData(s,d,target){if(!d)return{...s,email:target};const prog={...(d.progress||{})};Object.entries(s.progress||{}).forEach(([k,v])=>{const o=prog[k];if(!o){prog[k]=v;return}const best=(v.best_score||0)>(o.best_score||0)?v:o;prog[k]={...o,...best,status:(o.status==='cleared'||v.status==='cleared')?'cleared':(best.status||o.status),best_score:Math.max(o.best_score||0,v.best_score||0),attempts:(o.attempts||0)+(v.attempts||0)}});const xp=(d.total_xp||0)+(s.total_xp||0);return{...d,email:target,total_xp:xp,level:getLevelInfo(xp).level,progress:prog,badges:[...new Set([...(d.badges||[]),...(s.badges||[])])],dismissed_wrong:[...new Set([...(d.dismissed_wrong||[]),...(s.dismissed_wrong||[])])]}}

async function migrateTemp(email){const target=(prompt('학습 기록을 옮길 회사 메일 주소를 입력하세요.\n(예: newbie@in.cd24.kr)')||'').trim().toLowerCase();if(!target)return;if(!target.endsWith(ALLOWED_DOMAIN)){alert(`${ALLOWED_DOMAIN} 메일만 입력할 수 있어요.`);return}
try{const srcRef=userRef(email),dstRef=userRef(target);const[src,dst]=await Promise.all([srcRef.get(),dstRef.get()]);const logs=await fireDb.collection('quiz_logs').where('user_email','==',email).get();
if(!confirm(`${email}\n→ ${target}\n\n학습 기록 ${src.exists?'있음':'없음'} / 풀이 로그 ${logs.size}건을 이관합니다.${dst.exists?'\n※ 회사 계정에 이미 기록이 있어서 두 기록을 합쳐요 (XP 합산, 진도는 최고 점수 기준).':''}\n\n이관 후 이 임시 계정은 사용할 수 없어요. 진행할까요?`))return;
if(src.exists){await dstRef.set(mergeUserData(src.data(),dst.exists?dst.data():null,target));await srcRef.delete()}
const docs=logs.docs;for(let i=0;i<docs.length;i+=MIGRATE_BATCH_SIZE){const b=fireDb.batch();docs.slice(i,i+MIGRATE_BATCH_SIZE).forEach(x=>b.update(x.ref,{user_email:target}));await b.commit()}
await fireDb.collection(TEMP_COLLECTION).doc(email).update({active:false,migrated_to:target,migrated_at:new Date().toISOString(),migrated_by:state.userEmail});
alert(`이관 완료! 신입 사원은 이제 ${target} 회사 Google 계정으로 로그인하면 돼요.`);await rAdmin()}
catch(e){console.error(e);alert('이관 실패: '+(e.message||e)+'\n다시 시도하면 남은 로그부터 이어서 이관돼요.')}}

async function showUserDetail(email,name){state.adminDetailEmail=email;state.adminDetailName=name;state.page='admin_detail';await rUserDetail()}

// ===== 사용자 상세 =====
let _detail=null;
function ansText(q,l){
 if(l.user_answer_text!=null&&l.user_answer_text!=='')return{txt:l.user_answer_text,known:true};
 if(!q)return{txt:l.user_answer||'(미응답)',known:true};
 if(q.type==='multiple_choice'){if(l.is_correct)return{txt:q.choices[q.answer],known:true};if(l.user_answer===''||l.user_answer==null)return{txt:'(미응답)',known:true};return{txt:'오답 (선택 보기 기록 없음)',known:false}}
 if(q.type==='ox')return{txt:l.user_answer==='true'?'O':l.user_answer==='false'?'X':'(미응답)',known:true};
 return{txt:l.user_answer||'(미응답)',known:true}}
function correctText(q){if(!q)return'-';if(q.type==='multiple_choice')return q.choices[q.answer];if(q.type==='ox')return q.answer?'O':'X';return q.answer}
function fmtDT(iso){return iso?new Date(iso).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}

async function rUserDetail(){const email=state.adminDetailEmail;const name=state.adminDetailName;$.innerHTML='<div class="loading">사용자 상세 이력 로딩 중...</div>';
const[logSnap,uSnap]=await Promise.all([fireDb.collection('quiz_logs').where('user_email','==',email).get(),fireDb.collection('users').doc(email).get()]);
const items=[];logSnap.forEach(d=>items.push(d.data()));items.sort((a,b)=>(a.answered_at||'').localeCompare(b.answered_at||''));const ud=uSnap.exists?uSnap.data():{};const wc=(await getWrongQuizIds(state.userEmail)).length;
// 문항 단위로 묶기
const qmap={};items.forEach(l=>{const k=`${l.world_id}|${l.stage_id}|${l.quiz_id}`;if(!qmap[k])qmap[k]={k,wid:l.world_id,sid:l.stage_id,qid:l.quiz_id,q:QUIZZES[l.world_id]?.[l.stage_id]?.questions.find(x=>x.id===l.quiz_id)||null,tries:[]};qmap[k].tries.push(l)});
const qs=Object.values(qmap).map(o=>{const c=o.tries.filter(t=>t.is_correct).length;const last=o.tries[o.tries.length-1];return{...o,correct:c,wrong:o.tries.length-c,lastOk:!!last.is_correct,lastAt:last.answered_at||'',never:c===0}});
// 스테이지 통계
const stg={};items.forEach(l=>{const k=`${l.world_id}/${l.stage_id}`;if(!stg[k])stg[k]={t:0,c:0};stg[k].t++;if(l.is_correct)stg[k].c++});
_detail={email,name,qs};state.detailFilter=state.detailFilter||'all';
const totalQ=items.length,correctQ=items.filter(x=>x.is_correct).length,acc=totalQ?Math.round(correctQ/totalQ*100):0,lv=getLevelInfo(ud.total_xp||0);const lastAt=items.length?items[items.length-1].answered_at:'';const firstAt=items.length?items[0].answered_at:'';const isTemp=email.toLowerCase().endsWith(TEMP_EMAIL_DOMAIN);
let h=nav(wc)+`<div class="page ud"><button class="btn-mini" onclick="state.adminTab='users';goAdmin()" style="margin-bottom:12px">← 사용자 목록</button>`;
// 프로필 헤더
h+=`<div class="ud-head"><div class="ud-prof"><div class="ud-av">${esc(name.charAt(0)||'?')}<span>Lv.${lv.level}</span></div><div><div class="ud-name">${esc(name)}${isTemp?'<span class="tmp-tag">임시</span>':''}</div><div class="ud-mail">${esc(email)}</div><div class="ud-title">${lv.title}</div></div></div><div class="ud-stats"><div><b>${(ud.total_xp||0).toLocaleString()}</b><span>XP</span></div><div><b>${totalQ.toLocaleString()}</b><span>풀이</span></div><div><b>${acc}%</b><span>정답률</span></div><div><b>${relDay(lastAt).txt}</b><span>최근 활동</span></div><div><b>${(ud.badges||[]).length}</b><span>배지</span></div></div></div>`;
// 활동 차트
const days=[];const today=new Date();for(let i=ADMIN_CHART_DAYS-1;i>=0;i--){const d=addDays(today,-i);days.push({key:fmtDate(d),label:`${d.getMonth()+1}/${d.getDate()}`,t:0,c:0})}const dmap={};days.forEach(d=>dmap[d.key]=d);items.forEach(l=>{if(!l.answered_at)return;const d=dmap[fmtDate(l.answered_at)];if(d){d.t++;if(l.is_correct)d.c++}});const mx=Math.max(1,...days.map(d=>d.t));const actDays=days.filter(d=>d.t>0).length;const sum30=days.reduce((a,d)=>a+d.t,0);
h+=`<div class="ud-card"><div class="ud-ct">최근 ${ADMIN_CHART_DAYS}일 풀이 활동<span>활동 ${actDays}일 · ${sum30.toLocaleString()}문항${firstAt?` · 첫 풀이 ${fmtDate(firstAt)}`:''}</span></div><div class="act-chart">${days.map(d=>`<div class="act-col" data-tip="${d.label} · ${d.t}문항${d.t?` (정답 ${d.c}, ${Math.round(d.c/d.t*100)}%)`:''}"><div class="act-bar ${d.t?'':'zero'}" style="height:${d.t?Math.max(4,Math.round(d.t/mx*100)):0}%"></div></div>`).join('')}</div><div class="act-axis"><span>${days[0].label}</span><span>최대 ${mx}문항/일</span><span>오늘</span></div></div>`;
// 월드별 진도
h+=`<div class="ud-card"><div class="ud-ct">월드별 진도<span>✅ 클리어 · 🏃 진행 중 · ➖ 미응시</span></div><div class="wp-grid">`;
MANIFEST.worlds.forEach(w=>{const cl=w.stages.filter(s=>(ud.progress||{})[`${w.id}_${s.id}`]?.status==='cleared').length;h+=`<div class="wp"><div class="wp-h"><span>${w.icon} ${w.title}</span><b>${cl}/${w.stages.length}</b></div><div class="wp-stages">`;w.stages.forEach(s=>{const p=(ud.progress||{})[`${w.id}_${s.id}`]||{};const sx=stg[`${w.id}/${s.id}`];const cls=p.status==='cleared'?'cl':(p.attempts>0||sx)?'ip':'no';h+=`<div class="wp-s ${cls}"><div class="wp-sn">${s.icon} ${s.title}</div><div class="wp-sv">${cls==='cl'?'✅':cls==='ip'?'🏃':'➖'} ${p.best_score!=null&&cls!=='no'?p.best_score+'점':''}</div><div class="wp-ss">${p.attempts?`응시 ${p.attempts}회`:''}${sx?` · 정답률 ${Math.round(sx.c/sx.t*100)}%`:''}</div></div>`});h+=`</div></div>`});
h+=`</div></div>`;
// 취약 영역
const weak=Object.entries(stg).filter(([k,v])=>v.t>=ADMIN_WEAK_STAGE_MIN).map(([k,v])=>{const[wid,sid]=k.split('/');const w=MANIFEST.worlds.find(x=>x.id===wid);const s=w?.stages.find(x=>x.id===sid);return{name:`${w?w.icon+' '+w.title:wid} › ${s?s.title:sid}`,acc:Math.round(v.c/v.t*100),t:v.t}}).sort((a,b)=>a.acc-b.acc).slice(0,ADMIN_WEAK_STAGE_TOP);
const rep=qs.filter(o=>o.wrong>0).sort((a,b)=>(b.never-a.never)||(b.wrong-a.wrong)).slice(0,ADMIN_WRONG_Q_TOP);
h+=`<div class="weak-g"><div class="ud-card"><div class="ud-ct">취약 스테이지<span>${ADMIN_WEAK_STAGE_MIN}문항 이상 푼 스테이지 중 정답률 낮은 순</span></div>${weak.length?weak.map(x=>`<div class="weak-row"><div class="weak-n">${x.name}</div><div class="mini-bar"><div class="stat-bar"><div class="stat-fill ${accCls(x.acc)}" style="width:${x.acc}%"></div></div><span>${x.acc}% <em>(${x.t}문항)</em></span></div></div>`).join(''):'<div class="ud-empty">아직 판단할 만큼 풀이가 쌓이지 않았어요.</div>'}</div><div class="ud-card"><div class="ud-ct">반복 오답 문항<span>클릭하면 해설로 이동</span></div>${rep.length?rep.map(o=>`<div class="rep-row" onclick="jumpToQ('${o.k}')"><span class="rep-cnt">${o.wrong}회</span><span class="rep-q">${esc(o.q?o.q.question.replace(/\n/g,' ').substring(0,ADMIN_Q_PREVIEW_LEN):'(삭제된 문항)')}</span>${o.never?'<span class="rep-tag">아직 못 맞춤</span>':''}</div>`).join(''):'<div class="ud-empty">틀린 문항이 없어요. 🎉</div>'}</div></div>`;
// 풀이 이력
const nWrong=qs.filter(o=>o.wrong>0).length,nNever=qs.filter(o=>o.never).length;
h+=`<div class="ud-card"><div class="ud-ct">문항별 풀이 이력<span>${qs.length}문항 · 총 ${totalQ}회 풀이</span></div><div class="ul-chips" style="margin-bottom:12px"><button class="ul-chip dchip ${state.detailFilter==='all'?'on':''}" onclick="setDetailFilter('all',this)">전체 <b>${qs.length}</b></button><button class="ul-chip dchip ${state.detailFilter==='wrong'?'on':''}" onclick="setDetailFilter('wrong',this)">한 번이라도 틀림 <b>${nWrong}</b></button><button class="ul-chip dchip ${state.detailFilter==='never'?'on':''}" onclick="setDetailFilter('never',this)">아직 못 맞춤 <b>${nNever}</b></button></div><div id="hist"></div></div>`;
h+=`</div>`;$.innerHTML=h;renderHistory()}

function setDetailFilter(f,btn){state.detailFilter=f;document.querySelectorAll('.dchip').forEach(c=>c.classList.remove('on'));btn.classList.add('on');renderHistory()}
function renderHistory(){const el=document.getElementById('hist');if(!el||!_detail)return;const f=state.detailFilter;const list=_detail.qs.filter(o=>f==='all'||(f==='wrong'?o.wrong>0:o.never));
const groups={};list.forEach(o=>{const k=`${o.wid}/${o.sid}`;(groups[k]=groups[k]||[]).push(o)});
const order=[];MANIFEST.worlds.forEach(w=>w.stages.forEach(s=>{const k=`${w.id}/${s.id}`;if(groups[k])order.push([k,w,s])}));Object.keys(groups).forEach(k=>{if(!order.find(x=>x[0]===k))order.push([k,null,null])});
if(!order.length){el.innerHTML='<div class="ud-empty">해당하는 문항이 없어요.</div>';return}
let h='';order.forEach(([k,w,s])=>{const arr=groups[k].sort((a,b)=>(a.lastOk-b.lastOk)||(b.wrong-a.wrong)||b.lastAt.localeCompare(a.lastAt));const t=arr.reduce((a,o)=>a+o.tries.length,0),c=arr.reduce((a,o)=>a+o.correct,0),acc=t?Math.round(c/t*100):0;
h+=`<div class="hg" id="hg-${k.replace('/','-')}"><div class="hg-h" onclick="this.parentElement.classList.toggle('open')"><span class="hg-t">${w?w.icon+' '+w.title:k.split('/')[0]} › ${s?s.icon+' '+s.title:k.split('/')[1]}</span><span class="hg-m">${arr.length}문항 · 오답 있는 문항 ${arr.filter(o=>o.wrong>0).length}</span><div class="mini-bar"><div class="stat-bar"><div class="stat-fill ${accCls(acc)}" style="width:${acc}%"></div></div><span>${acc}%</span></div><span class="hg-arr">▼</span></div><div class="hg-b">${arr.map(qCard).join('')}</div></div>`});
el.innerHTML=h}
function qCard(o){const q=o.q;const last=o.tries[o.tries.length-1];const cls=o.never?'never':o.lastOk?'ok':'ng';
let body='';
if(!q){body=`<div class="ud-empty">현재 퀴즈 파일에서 삭제된 문항이에요. (ID: ${esc(o.qid)})</div>`}
else{body=`<div class="wn-q">${esc(q.question).replace(/\n/g,'<br>')}</div>`;
 if(q.type==='multiple_choice'){const picked={};o.tries.forEach(t=>{const a=ansText(q,t);if(!t.is_correct&&a.known)picked[a.txt]=(picked[a.txt]||0)+1});body+=`<div class="rv-choices" style="margin-bottom:10px">${q.choices.map((c,ci)=>{const ok=ci===q.answer;const pc=picked[c]||0;return`<div class="rv-ch ${ok?'cc':''} ${pc?'qc-wrong':''}">${esc(c)}${ok?' <b class="qc-tag ok">정답</b>':''}${pc?` <b class="qc-tag ng">오답 선택 ${pc}회</b>`:''}</div>`}).join('')}</div>`}
 else{body+=`<div class="wn-ans">정답: ${esc(correctText(q))}</div>`}
 body+=`<div class="tries"><div class="tries-t">풀이 기록 (${o.tries.length}회 · 최신순)</div><div class="tries-list">${o.tries.slice().reverse().map(t=>{const a=ansText(q,t);return`<div class="try ${t.is_correct?'ok':'ng'}"><span class="try-r">${t.is_correct?'⭕':'❌'}</span><span class="try-a ${a.known?'':'unk'}">${esc(a.txt)}</span><span class="try-d">${fmtDT(t.answered_at)}</span></div>`}).join('')}</div></div>`;
 if(q.explanation)body+=`<div class="rv-exp"><div class="el">💡 해설</div><div class="et">${esc(q.explanation)}</div>${q.guide_ref?`<div class="er">📖 ${esc(q.guide_ref)}</div>`:''}</div>`}
const prev=q?q.question.replace(/\n/g,' '):'(삭제된 문항)';
return`<div class="wn qcard ${cls}" id="q-${o.k.replace(/\|/g,'-')}"><div class="wn-h" onclick="this.parentElement.classList.toggle('open')"><span class="qc-res">${o.lastOk?'⭕':'❌'}</span><div class="wn-prev">${esc(prev.substring(0,ADMIN_Q_PREVIEW_LEN))}${prev.length>ADMIN_Q_PREVIEW_LEN?'…':''}</div><span class="qc-sum">${o.tries.length}회 · 정답 ${o.correct}</span>${o.never?'<span class="rep-tag">아직 못 맞춤</span>':''}<span class="qc-date">${fmtDT(o.lastAt)}</span><div class="wn-arr">▼</div></div><div class="wn-body">${body}</div></div>`}
function jumpToQ(k){const id='q-'+k.replace(/\|/g,'-');let el=document.getElementById(id);if(!el){state.detailFilter='all';document.querySelectorAll('.dchip').forEach((c,i)=>c.classList.toggle('on',i===0));renderHistory();el=document.getElementById(id)}if(!el)return;el.closest('.hg')?.classList.add('open');el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}

async function goMap(){state.page='map';await rMap()}
async function goWrong(){state.page='wrongnotes';await rWrong()}
async function goDash(){state.page='dashboard';await rDash()}
async function goGuide(){state.page='guide';await rGuide()}

async function loadQuizData(){
try{
const mRes=await fetch('./quizzes/_manifest.json');
MANIFEST=await mRes.json();
for(const wid of QUIZ_WORLD_FILES){
const wRes=await fetch('./quizzes/'+wid+'.json');
const wData=await wRes.json();
QUIZZES[wid]=wData.stages;
}
console.log('Quiz data loaded:',Object.keys(QUIZZES).length,'worlds');
}catch(e){console.error('Failed to load quiz data:',e);$.innerHTML='<div class="loading" style="color:var(--ng)">퀴즈 데이터를 불러오지 못했습니다. 페이지를 새로고침 해주세요.</div>'}}

async function handleAuthUser(user){
if(!user){state.page='login';render();return}
const email=(user.email||'').toLowerCase();
const provider=(user.providerData&&user.providerData[0]&&user.providerData[0].providerId)||'';
let isTemp=false,tempInfo=null;
if(email.endsWith(ALLOWED_DOMAIN)&&provider==='google.com'){isTemp=false}
else if(email.endsWith(TEMP_EMAIL_DOMAIN)&&provider==='password'){
 try{const d=await fireDb.collection(TEMP_COLLECTION).doc(email).get();
  if(!d.exists){await denyLogin('등록되지 않은 임시 계정입니다. 관리자에게 문의해주세요.');return}
  tempInfo=d.data();
  if(tempInfo.migrated_to){await denyLogin(`이 임시 계정은 회사 계정(${tempInfo.migrated_to})으로 이관되었습니다. 회사 Google 계정으로 로그인해주세요.`);return}
  if(!tempInfo.active){await denyLogin('사용 중지된 임시 계정입니다. 관리자에게 문의해주세요.');return}
  if(!tempInfo.expires_at||tempInfo.expires_at.toDate()<=new Date()){await denyLogin(`만료된 임시 계정입니다. (만료일: ${fmtDate(tempInfo.expires_at)}) 관리자에게 연장을 요청해주세요.`);return}
  isTemp=true}
 catch(e){console.error(e);await denyLogin('임시 계정 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');return}}
else{await denyLogin(`${email} 은(는) 허용되지 않는 계정입니다. @in.cd24.kr 계정 또는 발급받은 임시 계정으로 로그인해주세요.`);return}
state.loginError='';state.userEmail=email;state.isTemp=isTemp;state.tempExpires=isTemp?tempInfo.expires_at:null;
state.userName=isTemp?(tempInfo.name||email.split('@')[0]):(user.displayName||email.split('@')[0]);
state.isAdmin=!isTemp&&ADMINS.includes(email);
$.innerHTML='<div class="loading">Loading...</div>';
try{await loadQuizData();if(!MANIFEST){return}state.userData=await loadUser(email,state.userName);state.page='map';await rMap()}
catch(e){console.error(e);await denyLogin(isTemp?'임시 계정 권한이 확인되지 않습니다. 만료·중지 여부를 관리자에게 문의해주세요.':'데이터를 불러오지 못했습니다. 다시 로그인해주세요.')}}
fireAuth.onAuthStateChanged(handleAuthUser);


</script>
